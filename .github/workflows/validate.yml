name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  metadata:
    name: Metadata and script checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Compile validation scripts
        run: python -m py_compile scripts/validate_metadata.py scripts/validate_dataset.py scripts/run_instance.py scripts/dataset_stats.py scripts/bootstrap_repos.py scripts/check_instance_completeness.py scripts/generate_dataset_table.py

      - name: Validate metadata
        run: python scripts/validate_metadata.py

      - name: Check instance completeness
        run: python scripts/check_instance_completeness.py

      - name: Validate generated dataset summary
        run: |
          python scripts/dataset_stats.py --output analysis/dataset_summary.md
          git diff --exit-code -- analysis/dataset_summary.md

      - name: Validate generated paper dataset table
        run: |
          python scripts/generate_dataset_table.py --output paper/dataset_table.md
          git diff --exit-code -- paper/dataset_table.md
