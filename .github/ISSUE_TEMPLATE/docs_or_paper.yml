name: Docs or paper improvement
description: Improve documentation, paper notes, related work, or positioning.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: textarea
    id: area
    attributes:
      label: Area
      description: Which document, paper section, or explanation should improve?
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed change
      description: What should be added, removed, clarified, or cited?
    validations:
      required: true
